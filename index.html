<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock and crypto watchlist logos</title>
<meta name="description" content="A static watchlist with stock, ETF and crypto logos in light and dark, from logoapi.sh ticker URLs. No key.">
<style>
  :root { --bg: #ffffff; --fg: #111418; --muted: #5b6470; --line: #e3e6ea; --tile-light: #ffffff; --tile-dark: #111418; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0d10; --fg: #eef1f4; --muted: #9aa3ad; --line: #252a31; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 24px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  th { font-size: 13px; font-weight: 600; color: var(--muted); }
  td.sym { font-weight: 600; font-variant-numeric: tabular-nums; }
  td.kind { color: var(--muted); font-size: 14px; }
  .tile { display: inline-flex; width: 48px; height: 48px; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid var(--line); }
  .tile.light { background: var(--tile-light); }
  .tile.dark { background: var(--tile-dark); }
  .tile img { width: 32px; height: 32px; object-fit: contain; }
  code { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Watchlist</h1>
  <p>Stocks, an ETF and coins. Each logo is one URL: <code>https://logoapi.sh/ticker/AAPL.svg</code>, or <code>/dark/ticker/AAPL.svg</code> for dark backgrounds. No key.</p>
  <table>
    <thead><tr><th>Symbol</th><th>Type</th><th>Light</th><th>Dark</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <h2>Companies by domain</h2>
  <table>
    <thead><tr><th>Domain</th><th>Type</th><th>Light</th><th>Dark</th></tr></thead>
    <tbody id="domains"></tbody>
  </table>
  <p style="margin-top:24px">Logos by <a href="https://logoapi.sh">logoapi.sh</a>. URLs built with <a href="https://www.npmjs.com/package/stock-ticker-logos">stock-ticker-logos</a>.</p>
</main>
<script>
// Generated by `npm run build` (build.mjs) from stock-ticker-logos url() and darkUrl().
// BEGIN ROWS
const ROWS = [
  {
    "symbol": "AAPL",
    "kind": "Stock",
    "light": "https://logoapi.sh/ticker/AAPL.svg",
    "dark": "https://logoapi.sh/dark/ticker/AAPL.svg"
  },
  {
    "symbol": "MSFT",
    "kind": "Stock",
    "light": "https://logoapi.sh/ticker/MSFT.svg",
    "dark": "https://logoapi.sh/dark/ticker/MSFT.svg"
  },
  {
    "symbol": "NVDA",
    "kind": "Stock",
    "light": "https://logoapi.sh/ticker/NVDA.svg",
    "dark": "https://logoapi.sh/dark/ticker/NVDA.svg"
  },
  {
    "symbol": "GOOGL",
    "kind": "Stock",
    "light": "https://logoapi.sh/ticker/GOOGL.svg",
    "dark": "https://logoapi.sh/dark/ticker/GOOGL.svg"
  },
  {
    "symbol": "TSLA",
    "kind": "Stock",
    "light": "https://logoapi.sh/ticker/TSLA.svg",
    "dark": "https://logoapi.sh/dark/ticker/TSLA.svg"
  },
  {
    "symbol": "META",
    "kind": "Stock",
    "light": "https://logoapi.sh/ticker/META.svg",
    "dark": "https://logoapi.sh/dark/ticker/META.svg"
  },
  {
    "symbol": "VOO",
    "kind": "ETF",
    "light": "https://logoapi.sh/ticker/VOO.svg",
    "dark": "https://logoapi.sh/dark/ticker/VOO.svg"
  },
  {
    "symbol": "BTC",
    "kind": "Coin",
    "light": "https://logoapi.sh/ticker/BTC.svg",
    "dark": "https://logoapi.sh/dark/ticker/BTC.svg"
  },
  {
    "symbol": "ETH",
    "kind": "Coin",
    "light": "https://logoapi.sh/ticker/ETH.svg",
    "dark": "https://logoapi.sh/dark/ticker/ETH.svg"
  },
  {
    "symbol": "SOL",
    "kind": "Coin",
    "light": "https://logoapi.sh/ticker/SOL.svg",
    "dark": "https://logoapi.sh/dark/ticker/SOL.svg"
  }
];
// END ROWS

// BEGIN DOMAINS
const DOMAINS = [
  {
    "symbol": "stripe.com",
    "kind": "Domain",
    "light": "https://logoapi.sh/icon/stripe.com.svg",
    "dark": "https://logoapi.sh/dark/icon/stripe.com.svg"
  },
  {
    "symbol": "github.com",
    "kind": "Domain",
    "light": "https://logoapi.sh/icon/github.com.svg",
    "dark": "https://logoapi.sh/dark/icon/github.com.svg"
  },
  {
    "symbol": "notion.so",
    "kind": "Domain",
    "light": "https://logoapi.sh/icon/notion.so.svg",
    "dark": "https://logoapi.sh/dark/icon/notion.so.svg"
  },
  {
    "symbol": "openai.com",
    "kind": "Domain",
    "light": "https://logoapi.sh/icon/openai.com.svg",
    "dark": "https://logoapi.sh/dark/icon/openai.com.svg"
  }
];
// END DOMAINS

function render(id, list) {
const tbody = document.getElementById(id);
for (const r of list) {
  const tr = document.createElement('tr');
  tr.innerHTML =
    '<td class="sym"></td><td class="kind"></td>' +
    '<td><span class="tile light"><img width="32" height="32" loading="lazy"></span></td>' +
    '<td><span class="tile dark"><img width="32" height="32" loading="lazy"></span></td>';
  tr.children[0].textContent = r.symbol;
  tr.children[1].textContent = r.kind;
  const [light, dark] = tr.querySelectorAll('img');
  light.src = r.light; light.alt = r.symbol + ' logo';
  dark.src = r.dark; dark.alt = r.symbol + ' logo, dark version';
  tbody.appendChild(tr);
}
}
render('rows', ROWS);
render('domains', DOMAINS);
</script>
</body>
</html>
